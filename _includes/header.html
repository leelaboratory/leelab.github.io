<header class="site-header">
  <div class="wrap masthead">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Lee Lab home">lee<span>lab</span><span class="brand-dot">.</span></a>
    <span class="masthead-description">Single Cell<br>Neurogenomics Group</span>
    <a class="institution" href="{{ site.links.cdn }}">Icahn School of Medicine<br><strong>at Mount Sinai</strong></a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu <span aria-hidden="true">☰</span></button>
  </div>
  <div class="nav-border">
<nav class="wrap nav" id="site-nav" aria-label="Main navigation">
    <ul>{% for item in site.nav %}
<li{% if item.button %} class="nav-join"{% endif %}><a href="{{ item.url | relative_url }}"{% if page.url contains item.url %} aria-current="page"{% endif %}>{{ item.label }}{% if item.button %}<span aria-hidden="true">↗</span>{% endif %}</a>
</li>
{% endfor %}</ul>
    <a class="nav-pi" href="{{ '/pi/' | relative_url }}"{% if page.url == '/pi/' %} aria-current="page"{% endif %}>Donghoon Lee, PhD <span aria-hidden="true">↗</span></a>
  </nav>
</div>
</header>
