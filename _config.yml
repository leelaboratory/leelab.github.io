# Site settings
title: Single Cell Neurogenomics Group
short_title: Lee Lab
tagline: Brain disorders, one cell at a time
description: >-
  The Lee Lab (Single Cell Neurogenomics Group) at the Icahn School of Medicine
  at Mount Sinai builds computational and machine learning methods to study
  brain disorders at single-cell resolution.
url: "https://leelab.us"
baseurl: ""
lang: en_US
timezone: America/New_York
email: admin@leelab.us
email_obfuscated: admin (at) leelab (dot) us

author:
  name: Donghoon Lee
  url: https://leelab.us/pi/

# Used by jekyll-seo-tag for link previews (default image is set in `defaults` below)
logo: /assets/img/mark.svg
twitter:
  username: leelaboratory
  card: summary_large_image
social:
  name: Lee Lab
  links:
    - https://github.com/leelaboratory
    - https://x.com/leelaboratory

links:
  scholar: https://scholar.google.com/citations?user=_a8xSwwAAAAJ
  orcid: https://orcid.org/0000-0003-0453-6059
  github: https://github.com/leelaboratory
  twitter: https://x.com/leelaboratory
  cv: https://drive.google.com/file/d/19uNtddUfWJHtHaqKHubVpVinGjlGPtrm/view
  profile: https://profiles.icahn.mssm.edu/donghoon-lee
  cdn: https://icahn.mssm.edu/research/neurogenomics
  cdn_team: https://icahn.mssm.edu/research/neurogenomics/team
  psychad: https://psych-ad.org/

nav:
  - { label: "Research", url: "/research/" }
  - { label: "Publications", url: "/publications/" }
  - { label: "People", url: "/team/" }
  - { label: "News", url: "/news/" }
  - { label: "Resources", url: "/software/" }
  - { label: "Join us", url: "/jobs/", button: true }

address:
  building: Hess Center for Science and Medicine, floors 8–9
  street: 1470 Madison Avenue
  city: New York, NY 10029
  map: https://www.google.com/maps/search/?api=1&query=1470+Madison+Avenue+New+York+NY+10029

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
sass:
  style: compressed
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

permalink: /news/:year/:month/:title/

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post, image: /assets/img/social-card.png }
  - scope: { path: "" }
    values: { layout: page, image: /assets/img/social-card.png }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - STAGING
  - vendor
  - node_modules
  - .local
  - .artifacts
  - .preview
  - .claude
  - .codex
  - .agents
  - AGENTS.md
  - CLAUDE.md
  - tmp
  - playwright-report
  - test-results
